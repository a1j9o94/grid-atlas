name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Everything that needs neither a browser nor a running site. Reports in about
  # a minute, so a typo never waits on the audit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:holdings
      - run: npm run build

  # What the page actually does, in a real browser against the real production
  # build. These three found every layout and legend regression this project has
  # had, and until now they only ran on someone's laptop when they remembered.
  # They are slow — the audit alone drives 216 viewport/view combinations — so
  # they run beside the fast job rather than after it.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keyed on the resolved Playwright version, because a browser build is
      # pinned to the client that drives it.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      # The system libraries are not in the cache, so they are installed even on
      # a hit; the browser download is what the cache saves.
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run build
      # Sequential, so a red run names one check rather than three interleaved
      # logs. Each starts and stops its own `next start`.
      - run: npm run audit
      - run: npm run probe:history
      - run: npm run probe:legend
